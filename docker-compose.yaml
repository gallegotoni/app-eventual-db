version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - appnet

  mic-api:
    build:
      context: ./mic-apiservice
    environment:
      # Puerto interno de tu API (tu app debe respetarlo)
      - PORT=3000
      # URL del proxy inverso de la DB:
      - DB_SERVICE_URL=http://traefik/db
    ports:
      - "3000:3000"
    labels:
      - traefik.enable=true
      # API en /api
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=3000
    networks:
      - appnet
    depends_on:
      - traefik

  mic-db:
    build: 
      context: ./mic-dbservice
    environment:
      # Puerto interno del servicio DB
      - PORT=4000
      # Nombre del servicio DNS que tus nodos usarán para descubrir peers
      - DNS_SERVICE_NAME=mic-db
      # (Opcional) lista de seeds por si quieres *bootstrapping* inicial, coma-separada
      # - PEERS=http://mic-db:4000
    expose:
      - "4000"
    labels:
      - traefik.enable=true
      # DB publicada bajo /db
      - traefik.http.routers.db.rule=PathPrefix(`/db`)
      - traefik.http.routers.db.entrypoints=web
      # Strip /db antes de reenviar a los contenedores
      - traefik.http.routers.db.middlewares=db-stripprefix
      - traefik.http.middlewares.db-stripprefix.stripprefix.prefixes=/db
      # Puerto interno de la DB
      - traefik.http.services.db.loadbalancer.server.port=4000
      # (Opcional) healthcheck HTTP del LB
      # - traefik.http.services.db.loadbalancer.healthcheck.path=/health
      # - traefik.http.services.db.loadbalancer.healthcheck.interval=5s
    networks:
      - appnet
    depends_on:
      - traefik

networks:
  appnet:
    driver: bridge
